<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./quiz-vendas.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz de Vendas</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070d1b;
        --text: #f4f7ff;
        --muted: #aab8d2;
        --line: #243657;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .container {
        text-align: center;
        padding: 32px 24px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        color: var(--text);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>Redirecionando para o quiz...</p>
      <p><a href="./quiz-vendas.html">Clique aqui se a página não abrir automaticamente.</a></p>
    </div>
  </body>
</html>
